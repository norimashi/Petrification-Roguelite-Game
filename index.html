<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石像の剣士</title>
  <style>
    body.boot-loading {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body.boot-loading #app {
      visibility: hidden;
    }

    #bootLoading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #000;
      color: #f4efe6;
      font: 800 18px/1.2 system-ui, sans-serif;
      letter-spacing: 0;
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="boot-loading">
  <section id="bootLoading" aria-live="polite">Now Loading</section>
  <main id="app" class="game-shell">
    <section class="topbar">
      <div class="title">
        <strong data-i18n="石像の剣士">石像の剣士</strong>
        <span id="floorText">深層 1</span>
      </div>
      <div class="meters">
        <div class="meter hp"><span data-i18n="HP">HP</span><b id="hpText"></b></div>
        <button id="deckBtn" class="meter pile-btn" type="button"><span data-i18n="所持">所持</span><b id="deckText">0</b></button>
        <div class="meter relic-meter"><span data-i18n="レリック">レリック</span><b id="relicText">0</b></div>
        <button id="drawPileBtn" class="meter pile-btn" type="button"><span data-i18n="山札">山札</span><b id="drawPileText">0</b></button>
        <button id="discardPileBtn" class="meter pile-btn" type="button"><span data-i18n="捨札">捨札</span><b id="discardPileText">0</b></button>
      </div>
      <label class="language-picker">
        <span data-i18n="言語">言語</span>
        <select class="language-select" data-language-select aria-label="Language"></select>
      </label>
      <button id="restartBtn" class="icon-btn" title="最初から" data-i18n-title="最初から">↻</button>
    </section>

    <section class="battlefield">
      <img class="battle-bg" src="assets/battle_bg.png" alt="">
      <div id="thresholdBanner" class="threshold-banner hidden"></div>
      <div id="turnStepBanner" class="turn-step-banner hidden"></div>
      <div class="actor player" id="playerActor">
        <div id="playerPetri" class="petri-badge"></div>
        <div class="actor-status-row player-status-row">
          <div id="playerBuffs" class="buffs status-icons" aria-label="player buffs"></div>
          <div id="playerDebuffs" class="debuffs" aria-label="player debuffs"></div>
        </div>
        <div class="sprite-frame">
          <div id="heroHuman" class="hero-sprite" aria-hidden="true"></div>
          <div id="heroStone" class="hero-sprite" aria-hidden="true"></div>
          <div id="heroSlash" class="hero-slash" aria-hidden="true"></div>
        </div>
        <div class="hp-row">
          <div class="healthbar" id="playerHealthbar"><i id="playerHpBar"></i></div>
          <div id="playerBlockBadge" class="block-badge hidden"></div>
        </div>
        <div id="playerHpText" class="player-hp"></div>
      </div>
      <div class="actor enemy" id="enemyActor">
        <div id="enemyIntent" class="intent"></div>
        <div id="enemyBuffs" class="buffs status-icons" aria-label="enemy statuses"></div>
        <img id="enemySprite" src="assets/enemy_petrifier_cutout.png" alt="">
        <div class="hp-row">
          <div class="healthbar" id="enemyHealthbar"><i id="enemyHpBar"></i></div>
          <div id="enemyBlockBadge" class="block-badge hidden"></div>
        </div>
        <div id="enemyHpText" class="enemy-hp"></div>
      </div>
      <aside class="combat-log" id="log"></aside>
    </section>

    <section class="control-row">
      <div class="energy" id="energyText"></div>
      <div class="status-line" id="statusLine"></div>
      <button id="endTurnBtn" class="end-turn" data-i18n="ターン終了">ターン終了</button>
    </section>

    <section id="hand" class="hand" aria-label="手札" data-i18n-aria-label="手札"></section>

    <section id="rewardModal" class="overlay hidden">
      <div class="modal">
        <h2 id="modalTitle">カード報酬</h2>
        <div class="scene-hud">
          <div class="scene-meter hp"><span data-i18n="HP">HP</span><b id="sceneHpText">0/0</b></div>
          <div class="scene-meter petri"><span data-i18n="石化">石化</span><b id="scenePetriText">0/100</b></div>
          <button id="sceneDeckBtn" class="scene-tool" type="button"><span data-i18n="所持カード">所持カード</span> <b id="sceneDeckText">0</b></button>
          <button id="debugCardBtn" class="scene-tool debug-tool hidden" type="button" data-i18n="カード追加">カード追加</button>
          <label class="language-picker scene-language-picker">
            <span data-i18n="言語">言語</span>
            <select class="language-select" data-language-select aria-label="Language"></select>
          </label>
          <button id="sceneRestartBtn" class="scene-tool icon" type="button" title="最初から" data-i18n-title="最初から">↻</button>
        </div>
        <div id="rewardCards" class="reward-cards"></div>
        <div class="modal-actions"></div>
      </div>
    </section>

    <section id="noticeModal" class="overlay notice-overlay hidden">
      <div class="modal notice-modal">
        <h2 id="noticeTitle">石化進行</h2>
        <img id="noticeStill" class="notice-still hidden" alt="">
        <div id="noticeText" class="notice-text"></div>
        <div class="modal-actions">
          <button id="noticeNextBtn" data-i18n="確認">確認</button>
        </div>
      </div>
    </section>

    <section id="pileModal" class="overlay hidden">
      <div class="modal pile-modal">
        <h2 id="pileTitle">山札</h2>
        <div id="pileCards" class="pile-cards"></div>
        <div class="modal-actions">
          <button id="pileCloseBtn" data-i18n="閉じる">閉じる</button>
        </div>
      </div>
    </section>
  </main>
  <script src="locales.js"></script>
  <script src="game.js"></script>
</body>
</html>
